[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "title-claim-intelligence"
version = "0.1.0"
description = "Non-persistent inference service for Title Claim Tracker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
server = ["uvicorn[standard]>=0.30,<1"]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
train-title-claim-classifier = "title_claim_intelligence.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
